name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Provider and store tests
        env:
          # Runner hardware is slower than a dev machine; stretch the harness's tight timeouts.
          USAGE_TEST_TIME_SCALE: 6
        run: ./Tests/run.sh

  build:
    name: Build
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=$(Scripts/app-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build Release app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/build.sh

      - name: Package DMG
        run: Scripts/make-dmg.sh "${{ steps.version.outputs.version }}" release/UsageBar.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: UsageBar-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: release/UsageBar.dmg
          if-no-files-found: error
